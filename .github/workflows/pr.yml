name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      build-version: "0.2.1"
      dotnet-version: "10.0.400"
      run-pack: true
      validate-pack: true
    secrets: inherit