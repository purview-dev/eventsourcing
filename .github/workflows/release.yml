name: Release

on:
  push:
    branches: [main]

concurrency:
  group: purview-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      build-version: "0.2.1"
      dotnet-version: "10.0.400"
      release-mode: NuGet
      release-branch: main
      upload-artifacts: true
    secrets: inherit