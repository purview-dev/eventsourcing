name: Reusable .NET Pack

on:
  workflow_call:
    inputs:
      pack-target-path:
        required: true
        type: string
      version:
        required: true
        type: string
      configuration:
        required: false
        type: string
        default: Release
      dotnet-global-json:
        required: false
        type: string
        default: global.json
      output-path:
        required: false
        type: string
        default: ./artifacts/package

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ inputs.dotnet-global-json }}

      - name: Restore project
        run: dotnet restore "${{ inputs.pack-target-path }}"

      - name: Build project
        run: dotnet build "${{ inputs.pack-target-path }}" --no-restore --configuration "${{ inputs.configuration }}"

      - name: Pack
        run: dotnet pack "${{ inputs.pack-target-path }}" --no-build --configuration "${{ inputs.configuration }}" -p:PackageVersion="${{ inputs.version }}" --output "${{ inputs.output-path }}"

      - name: Verify ZodSharp package includes buildTransitive guard
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("${{ inputs.output-path }}"/Purview.EventSourcing.ZodSharp*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No Purview.EventSourcing.ZodSharp package was produced; skipping guard verification."
            exit 0
          fi

          for pkg in "${packages[@]}"; do
            if ! unzip -Z1 "${pkg}" | grep -Fxq "buildTransitive/Purview.EventSourcing.ZodSharp.targets"; then
              echo "::error::Package $(basename "${pkg}") is missing buildTransitive/Purview.EventSourcing.ZodSharp.targets."
              exit 1
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          path: |
            ${{ inputs.output-path }}/*.nupkg
            ${{ inputs.output-path }}/*.snupkg
          if-no-files-found: error
